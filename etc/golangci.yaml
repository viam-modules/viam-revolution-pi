version: "2"
run:
  timeout: 900s
  modules-download-mode: readonly
  tests: true
linters:
  default: all
  disable:
    - asasalint
    - containedctx
    - contextcheck
    - cyclop
    - depguard
    - exhaustruct
    - forcetypeassert
    - funlen
    - gocognit
    - godox
    - err113
    - funcorder
    - gochecknoglobals
    - gochecknoinits
    - gocyclo
    - godoclint
    - importas
    - interfacebloat
    - ireturn
    - maintidx
    - makezero
    - mnd
    - musttag
    - nakedret
    - nestif
    - nlreturn
    - nonamedreturns
    - nosprintfhostport
    - paralleltest
    - prealloc
    - tagliatelle
    - testpackage
    - thelper
    - varnamelen
    - wrapcheck
    - wsl
    - wsl_v5
  settings:
    errcheck:
      check-blank: true
    gosec:
      excludes:
        - G115
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
        - composites
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
          disabled: false
          arguments:
            - allowTypesBefore: "testing.TB,*testing.T,*testing.B,*testing.F"
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: var-declaration
        - name: var-naming
    lll:
      line-length: 140
  exclusions:
    rules:
      - path: _test\.go$
        linters:
          - dupword
          - errcheck
          - exhaustive
          - goconst
          - gosec
      - path: /doc.go$
        linters:
          - lll
    generated: lax
formatters:
  enable:
    - gci
    - gofumpt
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(viam-labs/viam-revolution-pi)
    gofumpt:
      extra-rules: true
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
